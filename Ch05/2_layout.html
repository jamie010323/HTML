<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2_layout</title>
    <style>
        /* 초기화 */
        *{
            margin: 0;
            padding: 0;
            font:  normal 12px '돋움';
        }

        ul, ol { list-style: none; } 
        a { text-decoration: none; color: #111; } 
        input, textarea { outline: none;} 

        #container {
            width: 800px;
            height: auto;
            padding: 10px;
            border: 1px solid black;
            box-sizing: border-box;
            margin: 0 auto;
        }

        main {
            width: 100%;
            margin: 10px 0;
            background: #eee;
            padding: 10px;
            border: 1px solid black;
            box-sizing: border-box;
        }

    </style>
</head>
<body>
    <div id="container">
        <header>header</header>
        <main>
            main
        <section>section</section>
        <section>section</section>
    </main>
        <footer>footer</footer>
    </div>
</body>
</html>
