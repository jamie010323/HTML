<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>6_layout</title>
    <style>
        /* 초기화 */
        *{
            margin: 0;
            padding: 0;
            font:  normal 12px '돋움';
        }
        ul, ol { list-style: none; } 
        a { text-decoration: none; color: #111; } 
        input, textarea { outline: none;} 

        #container {
            width: 800px;
            height: auto;
            border: 1px solid black;
            box-sizing: border-box;
            padding: 10px;
            margin: 0 auto;
        }

        header {
            width: 100%;
            height: 120px;
            background: #eee;
            border: 1px dashed black;
            box-sizing: border-box;
            padding: 10px;
            
        }
        main {
            display: flex;
            justify-content: flex-start;
            min-height: 400px;
            border: 1px dashed black;
            box-sizing: border-box;
            padding: 10px;
            margin: 10px 0;
        }
        main > aside {
            width: 216px;
            height: 400px;
            background: lightgray;
            border: 1px dashed black;
            box-sizing: border-box;
            padding: 10px;
            margin-right: 10px;
        }

        main > section {
            width: 530px;
            height: 400px;
            background: lightgray;
            border: 1px dashed black;
            box-sizing: border-box;
            padding: 10px;
        }

        main > section > article {
            width: 100%;
            height: 168px;
            border: 1px dashed black;
            box-sizing: border-box;
            padding: 10px;
            margin-right: 10px;
            margin-bottom: 10px;

        }
        footer {
            width: 100%;
            height: 100px;
            border: 1px dashed black;
            box-sizing: border-box;
            padding: 10px;
            
        }
    </style>
</head>
<body>
    <div id="container">
        <header>header</header>
        <main>
            <p>main</p>
            <aside>aside</aside>
            <section>section
                <article>article #1</article>
                <article>article #2</article>
            </section>
        </main>
        <footer>footer</footer>
    </div>
</body>
</html>
